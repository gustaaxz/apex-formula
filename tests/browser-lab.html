<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>APEX â€” LaboratÃ³rio de jogabilidade</title><style>body{margin:0;background:#101820;color:#eaf4f6;font:14px system-ui}header{padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{padding:10px;border:0;border-radius:4px;cursor:pointer;background:#d8ff3e}output{display:block;white-space:nowrap;overflow:auto;height:18px;padding:8px 16px;background:#243139;font:13px monospace}iframe{width:100%;height:calc(100vh - 123px);border:0}#state{color:#adc7d3}</style>
<header><b>APEX Â· Teste por comandos de teclado</b><button id="launchProtocol">Largada só W 5 s</button><button id="gearProtocol">Teste marcha 6 s</button><button data-code="KeyW" data-seconds="4">Acelerar 4 s</button><button data-code="KeyE" data-seconds="0.05">Marcha E +</button><button data-code="KeyQ" data-seconds="0.05">Marcha Q âˆ’</button><button data-code="KeyZ" data-seconds="0.05">RÃ© Z</button><button data-code="KeyL" data-seconds="0.05">Limitador L</button><button data-code="KeyX" data-seconds="0.05">Reposicionar X</button><button data-code="KeyW" data-seconds="10">Acelerar 10 s</button><button data-code="KeyS" data-seconds="3">Frear 3 s</button><button data-code="KeyD" data-seconds="1">Direita 1 s</button><button data-code="KeyA" data-seconds="1">Esquerda 1 s</button><button data-code="KeyC" data-seconds="0.05">CÃ¢mera C</button><button data-code="Escape" data-seconds="0.05">Pausa Esc</button></header><output id="state">Aguardando o jogoâ€¦</output><output id="history">O laboratÃ³rio nÃ£o altera a fÃ­sica. Comandos passam pelos listeners reais de teclado.</output><iframe title="Jogo APEX Formula" src="../index.html"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#state'),history=document.querySelector('#history');let busy=false;
// Keep the controls in the game's focus context: an outer-frame click would
// correctly trigger the game's blur-to-pause behavior and invalidate this test.
frame.addEventListener('load',()=>{const bar=frame.contentDocument.createElement('div');bar.style.cssText='position:fixed;top:0;left:8px;z-index:10000;display:flex;gap:5px;background:#101820;padding:6px';document.querySelectorAll('button').forEach(b=>{b.style.cssText='font:12px system-ui;padding:8px;background:#d8ff3e;color:#101820;border:0;cursor:pointer';bar.appendChild(b);});frame.contentDocument.body.appendChild(bar);});
function sample(){const a=frame.contentWindow.apex,r=a?.race,p=r?.player;return {track:a?.track?.name,phase:r?.phase,speedKph:p?+(p.speed*3.6).toFixed(1):0,lane:p?+p.lane.toFixed(3):0,yaw:p?+p.yaw.toFixed(4):0,metres:p?+p.d.toFixed(2):0,gear:p?.gear,rpm:r?.rpm,clutch:p?.clutch,engineRunning:p?.engineRunning,pitch:p?.chassis?.pitch,roll:p?.chassis?.roll,heave:p?.chassis?.height-r?.track.at(p.d).y,wheelLoads:p?.suspension?.map(w=>Math.round(w.load)),wheelTravel:p?.suspension?.map(w=>+w.compression.toFixed(5)),aero:p?.aero,render:a?.carRender,temp:p?.temp,frontTemp:p?.frontTemp,rearTemp:p?.rearTemp,pitLimiter:p?.pitLimiter,battery:p?.battery,damage:p?.damage,collisions:r?.collisions,fps:a?.fps,assists:r?.config?.assists,brakeAssist:r?.config?.brakeAssist,tc:r?.config?.tc,abs:r?.config?.abs};}
setInterval(()=>{try{out.textContent=JSON.stringify(sample());}catch{}},250);
document.querySelectorAll('button[data-code]').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const start=sample(),code=b.dataset.code,win=frame.contentWindow;win.focus();win.dispatchEvent(new win.KeyboardEvent('keydown',{code,bubbles:true}));setTimeout(()=>{win.dispatchEvent(new win.KeyboardEvent('keyup',{code,bubbles:true}));history.textContent=JSON.stringify({command:code,seconds:+b.dataset.seconds,start,end:sample()});busy=false;},+b.dataset.seconds*1000);});
document.querySelector('#gearProtocol').onclick=()=>{if(busy)return;busy=true;const win=frame.contentWindow,start=sample();win.focus();const key=(code,type)=>win.dispatchEvent(new win.KeyboardEvent(type,{code,bubbles:true}));key('KeyW','keydown');let before,after;setTimeout(()=>{before=sample();key('KeyE','keydown');key('KeyE','keyup');setTimeout(()=>after=sample(),110);},3000);setTimeout(()=>{key('KeyW','keyup');history.textContent=JSON.stringify({protocol:'W por 6 s, E aos 3 s',start,beforeShift:before,afterShift:after,end:sample()});busy=false;},6000);};
document.querySelector('#launchProtocol').onclick=()=>{if(busy)return;busy=true;const win=frame.contentWindow;win.focus();const key=(code,type)=>win.dispatchEvent(new win.KeyboardEvent(type,{code,bubbles:true}));key('KeyW','keydown');history.textContent='Somente W pressionado; aguardando luzes.';const grid=sample();const wait=setInterval(()=>{if(sample().phase!=='race')return;clearInterval(wait);const start=sample();setTimeout(()=>{const end=sample();key('KeyW','keyup');key('KeyS','keydown');history.textContent=JSON.stringify({protocol:'Somente acelerador W, sem teclas de embreagem',grid,start,end});busy=false;},5000);},100);};</script></html>
