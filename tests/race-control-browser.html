<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX · Etapa 3</title>
<style>body{margin:0;background:#101820;color:#eaf4f6;font:13px system-ui}header,output{display:block;padding:10px 16px}button{padding:9px;background:#d8ff3e;border:0;cursor:pointer;margin:3px}iframe{width:100%;height:calc(100vh - 140px);min-height:450px;border:0}</style>
<header>ETAPA 3 · Exemplos controlados na tela real, sem gravação de progresso<br><button data-case="vsc-good">VSC correto</button><button data-case="vsc-bad">VSC adiantado</button><button data-case="return">Devolver posição</button><button data-case="penalty">Não devolver</button><button data-case="restart">Relargada</button><button data-case="pit">Parada da IA</button></header>
<output id="verification">Preparando…</output><iframe title="APEX · Direção de prova em avaliação" src="../index.html"></iframe>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('output'),query=new URLSearchParams(location.search);let fixture;
function tick(r,dt,change=()=>{}){r.time+=dt;r.control.tick(dt);change();r.control.observe(dt);}
function scenario(scenario){
 const win=frame.contentWindow,doc=frame.contentDocument;win.focus();
 if(win.apex.race){doc.getElementById('pauseButton').click();doc.getElementById('leave')?.click();}
 doc.querySelector('[data-mode="gp"]').click();doc.getElementById('race').click();doc.getElementById('startGP').click();
 const r=win.apex.race,p=r.player,b=r.cars[0],kind=scenario==='mobile'?'vsc-bad':scenario;
 // Pause physics only in this laboratory so a deterministic example stays visible.
 r.phase='paused';r.cars=[p,b];r.time=0;r.position=2;r.messages=[];p.d=100;p.speed=20;p.lane=0;b.d=108;b.speed=20;b.lane=3.2;
 let maxLaneStep=0;
 if(kind==='pit'){
  r.config.pitLap=1;p.d=-1500;b.d=r.track.length-670;b.speed=50;
  let last=b.lane;
  for(let i=0;i<120*100;i++){
   r.time+=1/120;r.updateAI(1/120);maxLaneStep=Math.max(maxLaneStep,Math.abs(b.lane-last));last=b.lane;
   if(b.pitted&&!b.pitPhase)break;
  }
 }else if(kind==='restart'){
  p.d=100;b.d=80;r.control.activate('sc',.1);tick(r,.2);p.d=r.control.restartLine+1;tick(r,.1);
 }else{
  if(kind.startsWith('vsc'))b.d=1000;
  r.control.activate('vsc',30);
  if(kind.startsWith('vsc'))for(let i=0;i<70;i++)tick(r,.1,()=>p.d+=kind==='vsc-bad'?5:3);
  else{
   tick(r,.5,()=>p.d=109);
   if(kind==='return')tick(r,.5,()=>p.d=105);
   tick(r,6);
  }
 }
 fixture={scenario,kind,r,p,b,maxLaneStep};verify();
}
function verify(){
 const {scenario,kind,r,p,b,maxLaneStep}=fixture,doc=frame.contentDocument;
 const notice=doc.getElementById('raceControlNotice');
 const dataOk=kind==='pit'?b.pitted&&!b.pitPhase&&maxLaneStep<.04:
  kind==='restart'?r.flag==='green':kind==='penalty'||kind==='vsc-bad'?r.penalty===5:r.penalty===0;
 const visible=kind.startsWith('vsc')?!notice.classList.contains('hidden')&&notice.textContent.includes('DELTA VSC'):true;
 const ok=dataOk&&visible;
 const report={scenario,ok,penalty:r.penalty,flag:r.flag,delta:r.control.active==='vsc'?r.control.delta(p):null,pitted:!!b.pitted,pitPhase:b.pitPhase||'',maxLaneStep,notice:notice.textContent};
 out.dataset.report=JSON.stringify(report);out.textContent=`${ok?'OK':'Aguardando'} · ${scenario} · punição ${r.penalty} s · ${r.flag}`;
 if(!ok)setTimeout(verify,100);
}
frame.addEventListener('load',()=>{
 document.querySelectorAll('[data-case]').forEach(button=>button.onclick=()=>scenario(button.dataset.case));
 out.textContent='Escolha um cenário.';if(query.has('case'))scenario(query.get('case'));
});
</script></html>
